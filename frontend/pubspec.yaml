name: frontend_portal
description: "A modern, multilingual Flutter web and mobile frontend portal with go_router for public agency profile."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  http: ^1.2.2
  provider: ^6.1.2
  intl: any
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.1
  flutter_widget_from_html_core: ^0.15.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
